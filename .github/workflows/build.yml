name: Build WVB Desktop Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch Camoufox browser
        run: camoufox fetch

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libstdc++6 libgtk-3-0 libdbus-glib-1-2

      - name: Install macOS runtime tools
        if: runner.os == 'macOS'
        run: brew update && brew install python-tk

      - name: Compile application
        run: pyinstaller --clean --noconfirm --onefile --collect-all camoufox --name WVB-${{ matrix.os }} main.py

      - name: Assemble distributable bundle
        shell: bash
        run: |
          mkdir -p release/camoufox-cache
          python tools/package_browser.py release/camoufox-cache
          cp config.json release/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/WVB-${{ matrix.os }}.exe release/
          else
            cp dist/WVB-${{ matrix.os }} release/
          fi
          printf '%s\n' 'WVB Desktop Performance Suite' 'The bundle includes the compiled executable and Camoufox browser cache.' > release/README.txt

      - name: Bundle Microsoft C++ runtime DLLs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $runtime = "release\windows-runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          foreach ($name in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            $source = "C:\Windows\System32\$name"
            if (Test-Path $source) { Copy-Item $source $runtime -Force }
          }

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: WVB-${{ matrix.os }}
          path: release/
          if-no-files-found: error
          retention-days: 14
