name: Build WVB Windows Desktop Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build single Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Fetch Camoufox browser
        shell: pwsh
        run: camoufox fetch

      - name: Run browser-free contract tests
        shell: pwsh
        run: python tests_contracts.py

      - name: Run real localhost Camoufox smoke test
        shell: pwsh
        run: python tests_smoke.py

      - name: Build single standalone executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm WVB.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path dist\WVB.exe)) { throw "WVB.exe was not created" }
          if (Test-Path dist\WVB\WVB.exe) { throw "A one-folder build was produced; expected single-file WVB.exe" }
          $size = (Get-Item dist\WVB.exe).Length
          if ($size -lt 100000000) { throw "WVB.exe is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash dist\WVB.exe -Algorithm SHA256).Hash
          "$hash  WVB.exe" | Out-File dist\WVB.exe.sha256 -Encoding ascii
          Write-Host "Verified WVB.exe: $size bytes"
          Write-Host "SHA256: $hash"

      - name: Run frozen import/startup smoke test
        shell: pwsh
        timeout-minutes: 2
        run: .\dist\WVB.exe --startup-check

      - name: Run frozen UI smoke test
        shell: pwsh
        timeout-minutes: 2
        run: .\dist\WVB.exe --ui-smoke-test

      - name: Verify checksum file
        shell: pwsh
        run: |
          $expected = ((Get-Content dist\WVB.exe.sha256).Split(' ')[0]).Trim()
          $actual = (Get-FileHash dist\WVB.exe -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "SHA-256 mismatch: expected $expected, got $actual" }
          Write-Host "SHA-256 verified: $actual"

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: WVB-windows-${{ github.sha }}
          path: |
            dist/WVB.exe
            dist/WVB.exe.sha256
          if-no-files-found: error
          retention-days: 14
