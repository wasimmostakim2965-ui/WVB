name: Build WVB Windows Desktop Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build single Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch Camoufox browser
        shell: pwsh
        run: camoufox fetch

      - name: Build single standalone executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm WVB.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path dist\WVB.exe)) { throw "WVB.exe was not created" }
          $size = (Get-Item dist\WVB.exe).Length
          if ($size -lt 100000000) { throw "WVB.exe is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash dist\WVB.exe -Algorithm SHA256).Hash
          "$hash  WVB.exe" | Out-File dist\WVB.exe.sha256 -Encoding ascii
          Write-Host "Verified WVB.exe: $size bytes"
          Write-Host "SHA256: $hash"

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: WVB-windows-${{ github.sha }}
          path: |
            dist/WVB.exe
            dist/WVB.exe.sha256
          if-no-files-found: error
          retention-days: 14
