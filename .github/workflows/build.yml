name: Build WVB Desktop Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch Camoufox browser
        run: camoufox fetch

      - name: Compile application
        run: pyinstaller --clean --noconfirm --onefile --name WVB-${{ matrix.os }} main.py

      - name: Assemble distributable bundle
        shell: bash
        run: |
          mkdir -p release/camoufox-cache
          cp -r "$HOME/.cache/camoufox/browsers" release/camoufox-cache/
          cp config.json release/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/WVB-${{ matrix.os }}.exe release/
          else
            cp dist/WVB-${{ matrix.os }} release/
          fi
          printf '%s\n' 'WVB Desktop Performance Suite' 'The bundle includes the compiled executable and Camoufox browser cache.' > release/README.txt

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: WVB-${{ matrix.os }}
          path: release/
          if-no-files-found: error
          retention-days: 14
