name: Build WVB Windows Desktop Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build single Windows executable
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch Camoufox browser
        shell: pwsh
        run: camoufox fetch

      - name: Build single standalone executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm WVB.spec

      - name: Verify only the executable is delivered
        shell: pwsh
        run: |
          if (!(Test-Path dist\WVB.exe)) { throw "WVB.exe was not created" }
          $size = (Get-Item dist\WVB.exe).Length
          if ($size -lt 100000000) { throw "WVB.exe is unexpectedly small: $size bytes" }
          Write-Host "Verified standalone WVB.exe: $size bytes"

      - name: Publish direct EXE download
        shell: pwsh
        run: |
          gh release view wvb-latest --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create wvb-latest --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "WVB Windows latest" --notes "Direct single-file Windows executable. Configuration is created beside WVB.exe on first launch."
          }
          gh release upload wvb-latest dist\WVB.exe --repo "${{ github.repository }}" --clobber
          $download = "https://github.com/${{ github.repository }}/releases/download/wvb-latest/WVB.exe"
          Write-Host "Direct download: $download"
          @"
          ## WVB Windows download

          **[Download the single-file WVB.exe directly]($download)**

          No ZIP, DLL, config, or README download is required.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
