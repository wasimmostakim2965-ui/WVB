name: Build WVB Windows Desktop Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows 7-11 package
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch Camoufox browser
        shell: pwsh
        run: camoufox fetch

      - name: Build single standalone executable
        shell: pwsh
        # WVB.spec owns the onefile=True and console=False settings. PyInstaller
        # rejects makespec flags such as --noconsole when a spec is supplied.
        run: pyinstaller --clean --noconfirm WVB.spec

      - name: Assemble clean Windows delivery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\WVB.exe release\WVB.exe -Force
          $config = @{
            target_url = "https://example.com"
            visits = "10"
            min_duration = "8"
            max_duration = "15"
            scrolling_enabled = $true
            speed = "Auto"
            max_parallel = 2
          } | ConvertTo-Json
          Set-Content -Path release\config.json -Value $config -Encoding UTF8
          @(
            "WVB Windows one-file desktop application"
            "The executable embeds BrowserForge, Camoufox, Playwright, fingerprint data, and the Camoufox browser."
            "Configuration is created beside WVB.exe on first launch."
          ) | Set-Content release\README.txt -Encoding UTF8

      - name: Bundle Microsoft C++ runtime DLLs when available
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\windows-runtime | Out-Null
          foreach ($name in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            $source = "C:\Windows\System32\$name"
            if (Test-Path $source) { Copy-Item $source release\windows-runtime\ -Force }
          }

      - name: Verify standalone Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path release\WVB.exe)) { throw "WVB.exe was not created" }
          $size = (Get-Item release\WVB.exe).Length
          if ($size -lt 100000000) { throw "WVB.exe is unexpectedly small: $size bytes" }
          Write-Host "Verified standalone WVB.exe: $size bytes"
          Get-ChildItem release -Recurse | Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WVB-windows
          path: release/
          if-no-files-found: error
          retention-days: 14
