<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>WVB Tools — 19 Free Online Tools for Images, PDF, Text & More</title>
    <meta
      name="description"
      content="Free, fast, private online tools that run in your browser. Convert images, edit PDFs, check your IP, test speed, generate QR codes and 14 more tools. No sign-up."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://wvbtools.com/" />
    <!--seo-->

    <!-- Google AdSense.
         Replace ca-pub-XXXXXXXXXXXXXXXX with your real publisher id in the three
         places below and in public/ads.txt. The meta tag lets Google verify that
         you own the site; the script is what serves the ads. Consent Mode starts
         every signal as "denied" so no advertising cookie is set until the visitor
         accepts, at which point the app updates the signals to "granted". -->
    <meta name="google-adsense-account" content="ca-pub-XXXXXXXXXXXXXXXX" />
    <script>
      window.__ADSENSE_CLIENT__ = 'ca-pub-XXXXXXXXXXXXXXXX'
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
      })
    </script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!--noscript-->
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
